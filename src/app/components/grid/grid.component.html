<table mat-table [dataSource]="meals" class="meals-table mat-elevation-z2">

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let meal">{{ meal.strMeal }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Ver</th>
    <td mat-cell *matCellDef="let meal">
      <button mat-button color="primary" (click)="onRowClick(meal.idMeal)">
        Ver →
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr
    mat-row
    *matRowDef="let meal; columns: displayedColumns"
    class="meal-row"
    (click)="onRowClick(meal.idMeal)"
  ></tr>
</table>
